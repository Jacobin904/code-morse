<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Morse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #morse-btn {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(145deg, #e94560, #c81e45);
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #morse-btn:active,
        #morse-btn.active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.6);
            background: linear-gradient(145deg, #ff6b81, #e94560);
        }

        .pulse {
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.7); }
            70% { box-shadow: 0 0 0 30px rgba(233, 69, 96, 0); }
            100% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0); }
        }
    </style>
</head>
<body>
    <button id="morse-btn">APPUIE</button>

    <script>
        const btn = document.getElementById('morse-btn');
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;

        function startSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            // Créer l'oscillateur (son de code morse - onde carrée à 700Hz)
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();

            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(700, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            btn.classList.add('active', 'pulse');
        }

        function stopSound() {
            if (oscillator) {
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                oscillator.stop(audioCtx.currentTime + 0.05);
                oscillator = null;
            }
            btn.classList.remove('active', 'pulse');
        }

        // Souris
        btn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            startSound();
        });

        btn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            stopSound();
        });

        btn.addEventListener('mouseleave', (e) => {
            stopSound();
        });

        // Tactile (mobile)
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startSound();
        });

        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            stopSound();
        });

        btn.addEventListener('touchcancel', (e) => {
            stopSound();
        });
    </script>
</body>
</html>
